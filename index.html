<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STM SOFTWARE | Certificate Verification</title>

<style>

body{

}

.header{
    text-align:center;
    font-size:42px;

    height:500px;
    margin:0 auto 40px;
    background:#fff;
    padding:50px 35px;
    border-radius:0;

    color:#00A651;
    font-size:32px;
    font-weight:700;
    text-align:center;
    margin-bottom:45px;
}

.title{
    font-size:20px;
    font-weight:700;
    color:#555;
    text-align:center;
    margin-top:30px;
}

.value{
    font-size:18px;
    color:#666;
    text-align:center;
    margin-top:10px;
    line-height:1.6;
}

@media (max-width:768px){

    font-size:30px;
    margin:28px 0 25px;
}

.card{
    width:84%;
    max-width:430px;
    padding:34px 24px;

    font-size:24px;
