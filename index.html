<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STM SOFTWARE | Certificate Verification</title>
<style>
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #ececf3;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px 10px;
}

.header {
    text-align: center;
    font-size: clamp(26px, 5vw, 42px);
    font-weight: 300;
    color: #555;
    margin: 20px 0 25px;
}

.card {
    width: 100%;
    max-width: 484px;      /* د ډیسکټاپ لپاره عظمي پلنوالی */
    min-height: 500px;     /* لوړوالی لږ تر لږه ۵۰۰px */
    background: #fff;
    padding: 40px 25px;
    border-radius: 0;
    box-shadow: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.valid {
    color: #00A651;
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 700;
    text-align: center;
    margin-bottom: 30px;
}

.title {
    font-size: clamp(15px, 3vw, 20px);
    font-weight: 700;
    color: #555;
    text-align: center;
    margin-top: 20px;
}

.value {
    font-size: clamp(14px, 2.5vw, 18px);
    color: #666;
    text-align: center;
    margin-top: 6px;
    line-height: 1.5;
    word-break: break-word; /* که نوم یا معلومات اوږده وي له کارت څخه بهر نه وځي */
}

/* په کوچنیو موبایلونو کې د ښه تنظیم لپاره */
@media (max-width: 480px) {
    .card {
        padding: 30px 15px;
        min-height: auto; /* په خورا کوچنیو موبایلونو کې متن منظم ساتي */
    }
}
</style>
</head>
<body>

<div class="header">STM SOFTWARE</div>

<div class="card">
    <div class="valid">Valid Certificate</div>
    
    <div class="title">Certificate Number</div>
    <div class="value">LS-AD-2026-460009</div>
    
    <div class="title">Certificate Validity</div>
    <div class="value">20/07/2029</div>
    
    <div class="title">Attendee Name</div>
    <div class="value">TAJGUL HIJRAN</div>
    
    <div class="title">Course Name</div>
    <div class="value">Lifting Supervisor (As Per ADNOC HSE-PSW-CP19)</div>
</div>

</body>
</html>
